version: "3.9"
services:
  app:
    build: .
    container_name: restaurantes-bot
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres
      SPRING_DATASOURCE_USERNAME: postgres.yuxrylsnqohghwhaexnd
      SPRING_DATASOURCE_PASSWORD: prepauni215938
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"

  db:
    image: postgres:15
    container_name: restaurantes-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: restaurantesdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
